<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sin conexión | Medellín Movilidata OS</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(18, 62, 122, 0.18), transparent 42%),
          linear-gradient(180deg, #f4f8fc 0%, #dfeaf7 100%);
        color: #123e7a;
        font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
      }

      .box {
        max-width: 520px;
        margin: 24px;
        padding: 28px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid rgba(18, 62, 122, 0.12);
        box-shadow: 0 18px 50px rgba(13, 28, 45, 0.12);
        text-align: center;
      }

      h1 {
        margin-top: 0;
        font-size: 2rem;
      }

      p {
        margin-bottom: 0;
        color: #3f546d;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Sin conexión</h1>
      <p>La aplicación volverá a sincronizar cuando recuperes red. Los recursos base de la PWA siguen disponibles.</p>
    </div>
  </body>
</html>
